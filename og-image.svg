  </text>

  <!-- CTA Badge -->
  <rect x="420" y="460" width="280" height="60" rx="30" fill="#006c49"/>
  <text x="560" y="498" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">
    Diagnóstico Gratuito
  </text>
