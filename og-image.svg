  </g>

  <!-- Text Content -->
  <text x="420" y="230" font-family="Manrope, Arial, sans-serif" font-size="72" font-weight="800" fill="white">
    BR Consultoria
  </text>

  <text x="420" y="300" font-family="Manrope, Arial, sans-serif" font-size="36" font-weight="600" fill="#8bf8c3">
